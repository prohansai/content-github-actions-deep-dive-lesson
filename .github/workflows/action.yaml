name: Deploy my lambda function

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: install linting libraries
        run: |
          cd function
          pip install flake8

      - name: lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install libraries
        run: |
          cd function
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then \
            pip install \
              --platform manylinux2014_x86_64 \
              --target . \
              --implementation cp \
              --python-version 3.14 \
              --only-binary=:all: \
              -r requirements.txt; \
          fi

      - name: create a zip bundle
        run: |
          cd function
          zip -r ../${{ github.sha }}.zip .

      - name: archive the artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipped-bundle
          path: ${{ github.sha }}.zip

  upload:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: zipped-bundle

      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: upload artifact to s3
        run: aws s3 cp ${{ github.sha }}.zip s3://my-bucket-347239ufj23iwe/${{ github.sha }}.zip

  test:
    runs-on: ubuntu-latest
    needs: upload
    steps:
      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: create test function
        run: |
          aws lambda create-function --function-name test-function \
            --code S3Bucket=my-bucket-347239ufj23iwe,S3Key=${{ github.sha }}.zip \
            --handler lambda_function.lambda_handler --runtime python3.14 \
            --role arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/my-lambda-role

      - name: wait 30 seconds
        run: sleep 30

      - name: destroy test function
        if: ${{ always() }}
        run: aws lambda delete-function --function-name test-function

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: update function code
        run: |
          aws lambda update-function-code \
            --function-name my-function \
            --s3-bucket my-bucket-347239ufj23iwe \
            --s3-key ${{ github.sha }}.zip \
            --publish
