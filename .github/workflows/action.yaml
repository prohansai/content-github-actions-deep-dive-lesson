name: Deploy my lambda function
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: install libraries
        run: |
          cd function
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt -t .; fi

      - name: create a zip bundle
        run: |
          cd function
          zip -r ../${{ github.sha }}.zip .

      - name: archive the artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipped-bundle
          path: ${{ github.sha }}.zip
  upload:
        runs-on: ubuntu-latest
        needs: build
        steps:
          - name: download artifact
            uses: actions/download-artifact@v4
            with:
              name: zipped-bundle
          - name: configure aws creds
            uses: aws-actions/aws-configure-credentials@v6.3.0
            with: 
              aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
              aws-secret=acccess-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
              aws-region: ap-south-2
          - name: upload artifact to s3
            run: aws s3 cp ${{ github.sha }}.zip s3://my-bucket-347239ufj23iwe/${{ github.sha }}.zip
            
              



        

